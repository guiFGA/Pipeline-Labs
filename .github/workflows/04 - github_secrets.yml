name: GitHub Secrets

on:
    
  workflow_dispatch:


jobs:
  test-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Do checkout
        uses: actions/checkout@v4

      - name: API credentials
        env:
            API_KEY: ${{secrets.API_KEY}}
            API_URL: ${{secrets.API_URL}}
        run: |
          echo "Conecting to external API..."
          echo "API URL: $API_URL"
          echo "API key was configured: ${API_KEY:+YES}"

      - name: Conect to database
        env:
            DB_HOST: ${{secrets.DB_HOST}}
            DB_USERNAME: ${{secrets.DB_USERNAME}}
            DB_PASSWORD: ${{secrets.DB_PASSWORD}}
            DB_PORT: ${{secrets.DB_PORT}}
        run: |
          echo "Configuring conection to database"
          echo "Host: $DB_HOST" 
          echo "Porta $DB_PORT:"
          echo "Usuário: $DB_USERNAME"
          echo "Senha: $DB_PASSWORD"

      - name: Deploy with token
        env:
            DEPLOY_TOKEN: ${{secrets.DEPLOY_TOKEN}}
        run: |
          echo "Preparing deploy"
          echo "Token de deploy: $DEPLOY_TOKEN"    
          echo "GitHub automatically hide the value in the logs" 
